<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <!-- Left Panel -->
    <aside class="sidebar">
      <h1>Tic Tac Toe</h1>

      <!-- Mode Selection -->
      <section class="mode-container">
        <h2>Select Mode</h2>
        <button id="twoPlayer">2 Players</button>
        <button id="playAI">Play vs AI</button>
      </section>

      <!-- Controls -->
      <section class="controls">
        <div class="msg-container hide">
          <p id="msg"></p>
          <button id="newGame">New Game</button>
        </div>
        <button id="reset">Reset Game</button>
      </section>
    </aside>

    <!-- Right Panel -->
    <main class="game-section">
      <div class="game">
        <button class="box" aria-label="Cell 1"></button>
        <button class="box" aria-label="Cell 2"></button>
        <button class="box" aria-label="Cell 3"></button>
        <button class="box" aria-label="Cell 4"></button>
        <button class="box" aria-label="Cell 5"></button>
        <button class="box" aria-label="Cell 6"></button>
        <button class="box" aria-label="Cell 7"></button>
        <button class="box" aria-label="Cell 8"></button>
        <button class="box" aria-label="Cell 9"></button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
